name: $(Date:yyyy.M.dd).$(Rev:r)

trigger:
  branches:
    include:
      - 'main'
  paths:
    exclude: []

pr:
  branches:
    include:
      - 'main'

resources:
  repositories:
    - repository: 'templates'
      type: 'git'
      name: 'Codat/YAMLBuildTemplates'

# Array values as Variables not supported by ADO
parameters:
  - name: ImagesToPublish
    type: object
    default:
      - 'codat.docs.ui'

  - name: DeploymentEnvironments
    type: object
    default:
      - name: integration
        shortCode: intg
        pool:
          name: codat-intg-managed-devops-pool-linux
        registryName: codatintgregistry

      - name: production
        shortCode: prod
        pool: codat-prod-managed-devops-pool-linux
        registryName: codatprodregistry

stages:
  - stage: 'build'
    pool:
      name: 'codat-intg-managed-devops-pool-linux'
    jobs:
      - template: Helm/build.frontend.job.yaml@templates
        parameters:
          ImagesToPublish: ${{ parameters.ImagesToPublish }}
          Version: '$(Build.BuildNumber)'
          BuildFolder: deployment
          # Images are Git LFS-tracked; a plain checkout leaves 130-byte
          # pointer files and Docusaurus only WARNS on unreadable images,
          # so the build would stay green while shipping broken images.
          GitLfs: true
          # Build-time site config, fetched on the agent (the vault blocks
          # public network access, so a KV-linked variable group can't read
          # it — only the pool agents can, via the private endpoint). KV
          # secret names can't contain underscores, hence the hyphenated
          # $() references; the bake file maps them to the underscored args.
          KeyVaultName: codat-integration
          KeyVaultSecretsFilter: 'docs-zendesk-key,docs-amplitude-api-key,docs-gtm-id'
          AdditionalBakeEnvironment:
            ZENDESK_KEY: $(docs-zendesk-key)
            AMPLITUDE_API_KEY: $(docs-amplitude-api-key)
            GTM_ID: $(docs-gtm-id)

  - ${{ if not(in( variables['Build.Reason'], 'PullRequest' )) }}:
    - ${{ each env in parameters.DeploymentEnvironments }}:
      - ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(env.name, 'production')) }}:
        - stage: ${{ env.name }}
          pool: ${{ env.pool }}
          jobs:
          - template: Helm/deploy.job.yaml@templates
            parameters:
              Environment: ${{ env.name }}
              RegistryName: ${{ env.registryName }}
              ImagesToPublish: ${{ parameters.ImagesToPublish }}
              ArgoApplicationName: docs

  # Docs search is an Algolia DocSearch index filled by Algolia's hosted
  # crawler. Ask it to re-crawl once production is live so search picks up
  # what just shipped; the crawler's own weekly schedule is the fallback.
  - ${{ if and(not(in(variables['Build.Reason'], 'PullRequest')), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
    - stage: reindex_search
      displayName: Reindex docs search
      dependsOn: production
      # The vault blocks public network access, so this has to run on a pool
      # agent that can reach it (same vault and pool as the build stage).
      pool:
        name: 'codat-intg-managed-devops-pool-linux'
      jobs:
        - job: trigger_algolia_crawl
          displayName: Trigger Algolia crawl
          # The deploy has already succeeded by this point. A failed trigger
          # should show as a warning, not turn the release red.
          continueOnError: true
          steps:
            - checkout: none

            - task: AzureKeyVault@2
              displayName: Load Algolia crawler credentials
              inputs:
                azureSubscription: 'Azure Resource Manager (Integration/UAT)'
                KeyVaultName: codat-integration
                SecretsFilter: 'docs-algolia-crawler-id,docs-algolia-crawler-user-id,docs-algolia-crawler-api-key'

            - bash: |
                set -euo pipefail
                status=$(curl --silent --show-error \
                  --output response.json --write-out '%{http_code}' \
                  --request POST \
                  --user "$CRAWLER_USER_ID:$CRAWLER_API_KEY" \
                  "https://crawler.algolia.com/api/1/crawlers/$CRAWLER_ID/reindex")
                cat response.json; echo
                if [ "$status" != "200" ]; then
                  echo "##vso[task.logissue type=warning]Algolia reindex request failed with HTTP $status"
                  exit 1
                fi
              displayName: Start crawl
              env:
                CRAWLER_ID: $(docs-algolia-crawler-id)
                CRAWLER_USER_ID: $(docs-algolia-crawler-user-id)
                CRAWLER_API_KEY: $(docs-algolia-crawler-api-key)
