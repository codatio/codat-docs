user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/x-javascript text/xml application/xml application/xml+rss;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name localhost;
        server_tokens off;
        port_in_redirect off;

        # `always` so the headers are also sent on 404s (add_header only
        # covers 2xx/3xx by default, and unknown paths here are real 404s).
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Referrer-Policy "origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        root /usr/share/nginx/html;
        index index.html;

        # Static Docusaurus output: no SPA fallback — unknown paths get the
        # generated 404 page with a real 404 status.
        error_page 404 /404.html;

        location / {
            absolute_redirect off;
            try_files $uri $uri/ =404;
        }

        # portal-ui's "What's New" dropdown (useParseWhatsNewFeed) fetches this
        # cross-origin from app.codat.io. GitHub Pages sent
        # Access-Control-Allow-Origin: * on everything; nginx must opt in.
        # add_header in a location suppresses the inherited server-level set,
        # so the security headers are repeated here.
        location = /updates/rss.xml {
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        # Disable .git directory
        location ~ /\.git {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
